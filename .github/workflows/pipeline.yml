name: Color Quantization Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Executar testes diariamente às 2 AM
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      run_type:
        description: 'Tipo de execução'
        required: true
        default: 'quick'
        type: choice
        options:
          - quick
          - full

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run tests
      run: python -m pytest -q --tb=short

  quick-experiment:
    name: Quick Experiment Matrix
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.inputs.run_type == 'quick'
    needs: test
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Prepare data
      run: |
        mkdir -p data/raw
        # Se houver imagens no repo, elas serão usadas; senão, criar controle
        if [ -z "$(find data/raw -name '*.png' -o -name '*.jpg')" ]; then
          echo "No images found, skipping experiment run"
        fi
    
    - name: Run quick test (reduced matrix)
      run: python scripts/run_all.py --config "config/experiments - teste rapido.yaml"
      continue-on-error: true
    
    - name: Generate report
      run: python scripts/generate_report.py
      if: always()
    
    - name: Upload results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: experiment-results-quick
        path: outputs/
        retention-days: 30

  full-experiment:
    name: Full Experiment Matrix
    runs-on: ubuntu-latest
    if: github.event.inputs.run_type == 'full' || (github.event_name == 'schedule')
    needs: test
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Prepare data
      run: |
        mkdir -p data/raw
        echo "Checking for images in data/raw..."
        ls -la data/raw/ || true
    
    - name: Run full matrix
      run: python scripts/run_all.py --config config/experiments.yaml
      continue-on-error: true
      timeout-minutes: 120
    
    - name: Generate report
      run: python scripts/generate_report.py
      if: always()
    
    - name: Upload results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: experiment-results-full
        path: outputs/
        retention-days: 60

  validate:
    name: Validation Checks
    runs-on: ubuntu-latest
    if: always()
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Validate colors (if outputs exist)
      run: |
        if [ -f outputs/metrics/runs.csv ]; then
          python scripts/validate_unique_colors.py || true
        else
          echo "No runs.csv found, skipping validation"
        fi
      continue-on-error: true

  summary:
    name: Workflow Summary
    runs-on: ubuntu-latest
    if: always()
    needs: [test, quick-experiment]
    
    steps:
    - name: Check job status
      run: |
        echo "✅ Pipeline completed"
        echo "Test status: ${{ needs.test.result }}"
        echo "Quick experiment status: ${{ needs.quick-experiment.result }}"
