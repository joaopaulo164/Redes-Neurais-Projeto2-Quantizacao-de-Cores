data_dir: data/raw
output_dir: outputs
seeds: [13]
capacities: [16]
models: [som, gng, kmeans]
max_train_pixels: 10000
inference_batch_size: 8192

som:
  epochs: 2
  batch_size: 256
  lr0: 0.5
  lrf: 0.05
  sigma_final: 0.5

gng:
  steps: 1000
  eps_b: 0.05
  eps_n: 0.0006
  insertion_interval: 100
  max_edge_age: 90
  alpha: 0.5
  beta: 0.005

kmeans:
  max_iter: 10
  tolerance: 0.0001